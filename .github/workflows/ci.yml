name: BizWave Enterprise QA & CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit-and-static-fitness:
    name: Unit Tests (Backend, Frontend, Python) & Evolvability Fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend Unit Tests & Architecture Evolvability Audit
        working-directory: backend
        run: |
          npm ci
          npm run test:unit
          npx tsx ../tests/system/evolvability.audit.spec.ts
      - name: Frontend Unit Tests & Strict TypeScript Production Build
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run build
      - name: Python Intelligence Unit Tests (pytest)
        working-directory: intelligence
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -v

  database-integrity:
    name: PostgreSQL Migrations, Ownership, Seeds & RLS Isolation Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizwave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Provision Roles, Run Migrations, Transfer Ownership, Seeds & RLS Verification
        env:
          PGPASSWORD: ci_postgres_password
        run: |
          psql -h 127.0.0.1 -U postgres -d bizwave < infrastructure/postgres/init-roles.sql
          for f in database/migrations/00*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < "$f"
          done
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/001_reference_data_and_plans.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/002_kenyan_sme_demo_tenants.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/003_community_literacy_curriculum.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE r RECORD;
            BEGIN
              FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
                EXECUTE format('ALTER TABLE public.%I OWNER TO bizwave_owner;', r.tablename);
              END LOOP;
              FOR r IN SELECT matviewname FROM pg_matviews WHERE schemaname = 'public' LOOP
                EXECUTE format('ALTER MATERIALIZED VIEW public.%I OWNER TO bizwave_owner;', r.matviewname);
              END LOOP;
              ALTER FUNCTION fn_refresh_analytics_views() OWNER TO bizwave_owner;
            END \$\$;
            GRANT USAGE ON SCHEMA public TO bizwave_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bizwave_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bizwave_app;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO bizwave_app;
          "
          PGPASSWORD=bizwave_app_dev_pw psql -h 127.0.0.1 -U bizwave_app -d bizwave -v ON_ERROR_STOP=1 < database/tests/test_database_integrity.sql

  full-system-qa-suite:
    name: Integration + System QA (Functional, Security, Performance, Compatibility)
    runs-on: ubuntu-latest
    needs: [unit-and-static-fitness, database-integrity]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizwave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bootstrap DB & Start Intelligence + API + Frontend Services
        env:
          PGPASSWORD: ci_postgres_password
          DATABASE_URL: postgresql://bizwave_app:bizwave_app_dev_pw@127.0.0.1:5432/bizwave
          REDIS_URL: redis://127.0.0.1:6379
          INTELLIGENCE_SERVICE_URL: http://127.0.0.1:8001
          JWT_ACCESS_SECRET: ci_access_secret_minimum_32_characters_long_01
          JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_characters_long_02
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          psql -h 127.0.0.1 -U postgres -d bizwave < infrastructure/postgres/init-roles.sql
          for f in database/migrations/00*.sql; do psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < "$f"; done
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/001_reference_data_and_plans.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/002_kenyan_sme_demo_tenants.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 < database/seeds/003_community_literacy_curriculum.sql
          psql -h 127.0.0.1 -U postgres -d bizwave -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE r RECORD;
            BEGIN
              FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
                EXECUTE format('ALTER TABLE public.%I OWNER TO bizwave_owner;', r.tablename);
              END LOOP;
              FOR r IN SELECT matviewname FROM pg_matviews WHERE schemaname = 'public' LOOP
                EXECUTE format('ALTER MATERIALIZED VIEW public.%I OWNER TO bizwave_owner;', r.matviewname);
              END LOOP;
              ALTER FUNCTION fn_refresh_analytics_views() OWNER TO bizwave_owner;
            END \$\$;
            GRANT USAGE ON SCHEMA public TO bizwave_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bizwave_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bizwave_app;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO bizwave_app;
          "
          pip install -r intelligence/requirements.txt
          (cd intelligence && uvicorn app.main:app --host 127.0.0.1 --port 8001 &)
          (cd backend && npm ci && npm run build && node dist/main.js &)
          (cd frontend && npm ci && npm run dev -- --host 0.0.0.0 --port 5173 &)
          sleep 6
      - name: Execute Full Integration, Functional, Security, Performance & Compatibility Suites
        working-directory: backend
        run: |
          npm run test:integration
          npx tsx ../tests/system/functional.e2e.spec.ts
          npx tsx ../tests/system/security.pentest.spec.ts
          npx tsx ../tests/system/performance.load.spec.ts
          npx tsx ../tests/system/usability.compat.spec.ts

  docker-verify:
    name: Verify Production Docker Image Builds
    runs-on: ubuntu-latest
    needs: [full-system-qa-suite]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: |
          docker build -t bizwave-intelligence:ci ./intelligence
          docker build -t bizwave-backend:ci ./backend
          docker build -t bizwave-frontend:ci ./frontend
