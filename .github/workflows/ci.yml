name: BizWave current-release checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit-and-build:
    name: Unit tests, current static checks and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests and build
        working-directory: backend
        run: |
          npm ci
          npm run test:unit
          npm run build
          npx tsx ../tests/system/evolvability.audit.spec.ts
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run build
      - name: Intelligence tests
        working-directory: intelligence
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q
      - name: Deployment and restore safety
        run: |
          bash -n scripts/deploy-vps.sh scripts/apply-migrations.sh scripts/bootstrap-sandbox.sh scripts/setup-https.sh infrastructure/scripts/backup-postgres.sh infrastructure/scripts/restore-postgres.sh
          tests/restore-safety.spec.sh

  database-integrity:
    name: PostgreSQL migrations and isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizwave_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: ci_postgres_password
    steps:
      - uses: actions/checkout@v4
      - name: Apply fresh migrations, production reference seed and runtime grants
        run: |
          psql -h 127.0.0.1 -U postgres -d bizwave_ci -v ON_ERROR_STOP=1 < infrastructure/postgres/init-roles.sql
          scripts/apply-migrations.sh psql -h 127.0.0.1 -U postgres -d bizwave_ci
          psql -h 127.0.0.1 -U postgres -d bizwave_ci -v ON_ERROR_STOP=1 < infrastructure/postgres/grant-runtime-access.sql
      - name: RLS, opt-in directory, audit and immutable-ledger tests
        run: PGPASSWORD=bizwave_app_dev_pw psql -h 127.0.0.1 -U bizwave_app -d bizwave_ci -v ON_ERROR_STOP=1 < database/tests/test_database_integrity.sql
      - name: Fresh, upgrade, failure recovery and untracked-schema migration tests
        run: tests/migration-regression.sh psql -h 127.0.0.1 -U postgres

  api-integration:
    name: Isolated portal API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizwave_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable database
        env:
          PGPASSWORD: ci_postgres_password
        run: |
          psql -h 127.0.0.1 -U postgres -d bizwave_ci -v ON_ERROR_STOP=1 < infrastructure/postgres/init-roles.sql
          scripts/apply-migrations.sh psql -h 127.0.0.1 -U postgres -d bizwave_ci
          psql -h 127.0.0.1 -U postgres -d bizwave_ci -v ON_ERROR_STOP=1 < infrastructure/postgres/grant-runtime-access.sql
      - name: Install and build API
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Run integration against local mock website analyzer
        env:
          NODE_ENV: development
          HOST: 127.0.0.1
          PORT: '4000'
          DATABASE_URL: postgresql://bizwave_app:bizwave_app_dev_pw@127.0.0.1:5432/bizwave_ci
          REDIS_URL: redis://127.0.0.1:6379
          INTELLIGENCE_URL: http://127.0.0.1:8002
          PORTAL_FEATURE_GATING_ENABLED: 'false'
          BIZWAVE_API_URL: http://127.0.0.1:4000/api/v1
          BIZWAVE_ALLOW_TEST_FIXTURES: '1'
          BIZWAVE_TEST_OWNER_DATABASE_URL: postgresql://bizwave_owner:bizwave_owner_dev_pw@127.0.0.1:5432/bizwave_ci
        run: |
          python3 tests/mock-intelligence.py > /tmp/bizwave-mock.log 2>&1 & mock_pid=$!
          (cd backend && node dist/main.js) > /tmp/bizwave-api.log 2>&1 & api_pid=$!
          trap 'kill "$mock_pid" "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/v1/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/bizwave-api.log /tmp/bizwave-mock.log; exit 1; fi
          (cd backend && npm run test:integration)

  docker-verify:
    name: Build production container images
    runs-on: ubuntu-latest
    needs: [unit-and-build, database-integrity, api-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t bizwave-intelligence:ci ./intelligence
          docker build -t bizwave-backend:ci ./backend
          docker build -t bizwave-frontend:ci ./frontend
