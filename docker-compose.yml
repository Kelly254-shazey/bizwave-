version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: bizwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizwave}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-bizwave_owner}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_owner_password}
      TZ: Africa/Nairobi
    ports:
      - "5432:5432"
    volumes:
      - bizwave_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-bizwave_owner} -d ${POSTGRES_DB:-bizwave}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-net

  redis:
    image: redis:7-alpine
    container_name: bizwave-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - bizwave_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-net

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: bizwave-intelligence
    restart: unless-stopped
    environment:
      INTELLIGENCE_HOST: 0.0.0.0
      INTELLIGENCE_PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Africa/Nairobi
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizwave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://bizwave_app:change_me_app_password@postgres:5432/bizwave}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTELLIGENCE_URL: http://intelligence:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      TZ: Africa/Nairobi
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizwave-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - bizwave-net

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: bizwave-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bizwave-net

volumes:
  bizwave_pgdata:
  bizwave_redis:

networks:
  bizwave-net:
    driver: bridge
