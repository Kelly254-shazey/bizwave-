# =============================================================================
# BizWave Production Docker Compose Stack (VPS + Nginx + Let's Encrypt HTTPS)
# Security:
#   - ONLY nginx exposes ports 80 and 443 to the public internet.
#   - PostgreSQL, Redis, Python Intelligence, Backend API, and Frontend live
#     exclusively on an internal Docker bridge network.
#   - Zero demo data or dev fallback secrets are mounted or permitted.
# Usage:
#   ./scripts/deploy-vps.sh yourdomain.co.ke
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: bizwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizwave}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      TZ: Africa/Nairobi
    volumes:
      - bizwave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-bizwave}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bizwave-internal

  redis:
    image: redis:7-alpine
    container_name: bizwave-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - bizwave_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-internal

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: bizwave-intelligence
    restart: unless-stopped
    environment:
      TZ: Africa/Nairobi
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizwave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      DATABASE_URL: postgresql://bizwave_app:${BIZWAVE_APP_PASSWORD:?BIZWAVE_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-bizwave}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTELLIGENCE_URL: http://intelligence:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UPLOAD_DIR: /app/uploads
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MSINGI_BASE_URL: ${MSINGI_BASE_URL:-https://api.msingiai.com}
      MSINGI_API_KEY: ${MSINGI_API_KEY:-}
      MSINGI_DEFAULT_VOICE: ${MSINGI_DEFAULT_VOICE:-female3}
      TZ: Africa/Nairobi
    volumes:
      - bizwave_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bizwave-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizwave-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bizwave-internal

  nginx:
    image: nginx:1.27-alpine
    container_name: bizwave-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - bizwave-internal

  certbot:
    image: certbot/certbot:latest
    container_name: bizwave-certbot
    profiles: ["ssl"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  bizwave_pgdata:
  bizwave_redis:
  bizwave_uploads:
  certbot_www:
  certbot_conf:

networks:
  bizwave-internal:
    driver: bridge
